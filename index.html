<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover" />
<meta name="theme-color" content="#0d1117" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Smart Parking" />
<meta name="description" content="Live parking availability" />
<title>Smart Parking — Live Availability</title>
<link rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🅿️</text></svg>" />

<style>
  /* ============================================
     RESET & BASE
     ============================================ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg:       #0d1117;
    --card:     #161b22;
    --border:   #30363d;
    --text:     #e6edf3;
    --muted:    #7d8590;
    --green:    #3fb950;
    --red:      #f85149;
    --blue:     #388bfd;
    --blue-dk:  #1f6feb;
    --yellow:   #d29922;
  }

  html, body {
    height: 100%;
    overscroll-behavior-y: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================
     HEADER
     ============================================ */
  .header {
    text-align: center;
    margin-bottom: 20px;
  }

  .header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .header p {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ============================================
     HERO — BIG AVAILABILITY NUMBER
     ============================================ */
  .hero {
    background: linear-gradient(135deg, var(--blue-dk), var(--blue));
    border-radius: 22px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 8px 28px rgba(56, 139, 253, 0.35);
    position: relative;
    overflow: hidden;
  }

  .hero::after {
    content: "";
    position: absolute;
    top: -40%;
    right: -20%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle,
                rgba(255,255,255,0.15), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    opacity: 0.9;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .hero .value {
    font-size: 5rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    text-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  .hero .sub {
    font-size: 0.85rem;
    opacity: 0.9;
    margin-top: 8px;
    letter-spacing: 0.5px;
  }

  /* ============================================
     STATS ROW
     ============================================ */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 22px;
  }

  .stat {
    background: var(--card);
    border-radius: 16px;
    padding: 18px 14px;
    text-align: center;
    border: 1px solid var(--border);
    transition: transform 0.15s;
  }

  .stat:active {
    transform: scale(0.97);
  }

  .stat .num {
    font-size: 2.1rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .stat .lbl {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-top: 8px;
    font-weight: 600;
  }

  .stat.occupied .num { color: var(--red); }
  .stat.vacant   .num { color: var(--green); }

  /* ============================================
     SECTION TITLES
     ============================================ */
  h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: var(--muted);
    margin: 22px 0 12px;
    font-weight: 700;
  }

  /* ============================================
     SLOT GRID
     ============================================ */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .slot {
    padding: 20px 12px;
    border-radius: 16px;
    text-align: center;
    font-weight: 700;
    border: 2px solid;
    transition: transform 0.15s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
  }

  .slot:active {
    transform: scale(0.96);
  }

  .slot.vacant {
    background: rgba(63, 185, 80, 0.12);
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 4px 20px rgba(63, 185, 80, 0.15);
  }

  .slot.occupied {
    background: rgba(248, 81, 73, 0.12);
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 4px 20px rgba(248, 81, 73, 0.15);
  }

  .slot .name {
    font-size: 1.4rem;
    display: block;
    letter-spacing: 0.5px;
  }

  .slot .status {
    font-size: 0.62rem;
    letter-spacing: 2px;
    opacity: 0.95;
    margin-top: 6px;
    display: block;
    font-weight: 700;
  }

  /* Pulse animation for vacant slots */
  .slot.vacant::before {
    content: "";
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(1.4); }
  }

  /* ============================================
     AVAILABLE CHIPS
     ============================================ */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 42px;
  }

  .chip {
    background: rgba(63, 185, 80, 0.15);
    border: 1.5px solid var(--green);
    color: var(--green);
    padding: 10px 20px;
    border-radius: 24px;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    animation: chipIn 0.3s ease;
  }

  @keyframes chipIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }

  .no-avail {
    background: rgba(248, 81, 73, 0.12);
    border: 1.5px solid var(--red);
    color: var(--red);
    padding: 12px 20px;
    border-radius: 14px;
    font-weight: 700;
    width: 100%;
    text-align: center;
    font-size: 0.9rem;
    letter-spacing: 1px;
  }

  /* ============================================
     FOOTER
     ============================================ */
  footer {
    margin-top: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    color: var(--muted);
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #484f58;
    transition: all 0.3s;
    flex-shrink: 0;
    margin-left: 10px;
  }

  .dot.online {
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    animation: dotPulse 2s infinite;
  }

  .dot.offline {
    background: var(--red);
    box-shadow: 0 0 12px var(--red);
  }

  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 12px var(--green); }
    50%      { box-shadow: 0 0 20px var(--green); }
  }

  /* ============================================
     LOADING / SKELETON
     ============================================ */
  .loading {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .spinner {
    display: inline-block;
    width: 22px;
    height: 22px;
    border: 2.5px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 10px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ============================================
     RESPONSIVE TWEAKS
     ============================================ */
  @media (max-width: 360px) {
    body { padding: 12px; }
    .hero .value { font-size: 4rem; }
    .slot .name  { font-size: 1.2rem; }
    .stat .num   { font-size: 1.8rem; }
  }

  @media (min-width: 600px) {
    .grid  { grid-template-columns: repeat(4, 1fr); }
    .hero .value { font-size: 6rem; }
  }

  /* Reduce motion preference */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <h1>🅿️ Smart Parking</h1>
    <p>Live Availability</p>
  </header>

  <!-- HERO — available count -->
  <div class="hero">
    <div class="label">Available Now</div>
    <div class="value" id="availableCount">--</div>
    <div class="sub">free slots</div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat occupied">
      <div class="num" id="occupied">--</div>
      <div class="lbl">Occupied</div>
    </div>
    <div class="stat vacant">
      <div class="num" id="vacant">--</div>
      <div class="lbl">Vacant</div>
    </div>
  </div>

  <!-- SLOT GRID -->
  <h2>Slot Status</h2>
  <div class="grid" id="grid">
    <div class="loading" style="grid-column: 1 / -1;">
      <div class="spinner"></div>
      <div>Connecting…</div>
    </div>
  </div>

  <!-- AVAILABLE CHIPS -->
  <h2>Free Slots</h2>
  <div class="chips" id="chips">
    <div class="loading" style="width:100%; text-align:left;">—</div>
  </div>

  <!-- FOOTER -->
  <footer>
    <span id="updated">Last updated: —</span>
    <span class="dot" id="dot"></span>
  </footer>

  <!-- ============================================
       FIREBASE + LOGIC
       ============================================ -->
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ---------- Firebase Config ----------
    const firebaseConfig = {
      apiKey: "AIzaSyARmrEynZcS3uiAlV5cBPuxNL0qX0OMkN0",
      authDomain: "project-ff663.firebaseapp.com",
      databaseURL: "https://project-ff663-default-rtdb.firebaseio.com",
      projectId: "project-ff663",
      storageBucket: "project-ff663.firebasestorage.app",
      messagingSenderId: "321788324970",
      appId: "1:321788324970:web:105494a56bd7f9e3d52e13",
      measurementId: "G-1C0662MD0L"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    // ---------- DOM refs ----------
    const $avail   = document.getElementById("availableCount");
    const $occ     = document.getElementById("occupied");
    const $vac     = document.getElementById("vacant");
    const $grid    = document.getElementById("grid");
    const $chips   = document.getElementById("chips");
    const $updated = document.getElementById("updated");
    const $dot     = document.getElementById("dot");

    // ---------- Helpers ----------
    function setOnline() {
      $dot.classList.add("online");
      $dot.classList.remove("offline");
    }

    function setOffline() {
      $dot.classList.add("offline");
      $dot.classList.remove("online");
    }

    // ---------- Realtime Listener ----------
    const parkingRef = ref(db, "parking");

    onValue(parkingRef, (snapshot) => {
      const data = snapshot.val();

      // No data yet
      if (!data) {
        $grid.innerHTML = `
          <div class="loading" style="grid-column: 1 / -1;">
            <div class="spinner"></div>
            <div>Waiting for data…</div>
          </div>`;
        return;
      }

      setOnline();

      // ---- Hero + Stats ----
      $avail.textContent = data.vacant ?? "--";
      $occ.textContent   = data.occupied ?? "--";
      $vac.textContent   = data.vacant ?? "--";

      // ---- Slots Grid ----
      $grid.innerHTML = "";
      const slots = data.slots || {};
      const sortedSlots = Object.entries(slots)
        .sort(([a], [b]) => a.localeCompare(b, undefined, { numeric: true }));

      if (sortedSlots.length === 0) {
        $grid.innerHTML = `
          <div class="loading" style="grid-column: 1 / -1;">
            No slots configured
          </div>`;
      } else {
        sortedSlots.forEach(([name, status]) => {
          const div = document.createElement("div");
          div.className = `slot ${status}`;
          div.innerHTML = `
            <span class="name">${name}</span>
            <span class="status">${status.toUpperCase()}</span>
          `;
          $grid.appendChild(div);
        });
      }

      // ---- Available Chips ----
      $chips.innerHTML = "";
      const available = data.available_slots || [];

      if (available.length === 0) {
        const div = document.createElement("div");
        div.className = "no-avail";
        div.textContent = "🚫 No slots available";
        $chips.appendChild(div);
      } else {
        available.forEach(name => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = name;
          $chips.appendChild(chip);
        });
      }

      // ---- Footer timestamp ----
      $updated.textContent = `Last updated: ${data.last_updated ?? "—"}`;

    }, (error) => {
      console.error("Firebase read error:", error);
      setOffline();
      $grid.innerHTML = `
        <div class="loading" style="grid-column: 1 / -1; color:#f85149;">
          ⚠️ Connection error
        </div>`;
    });
  </script>

</body>
</html>
